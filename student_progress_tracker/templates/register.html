<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration — Student Progress Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card-custom p-4 p-md-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">Student Registration</h3>
            <p class="text-secondary small">Enroll in the Academic Performance Management System</p>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form id="registerForm" method="POST" action="{{ url_for('register') }}" class="needs-validation" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">University Roll No</label>
                <input type="text" name="roll_no" class="form-control" placeholder="CS2026-004" required />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="Priya Sundaram" required />
              </div>
              <div class="col-md-12">
                <label class="form-label fw-semibold small">College Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="priya@college.edu" required />
              </div>
              <div class="col-md-8">
                <label class="form-label fw-semibold small">Department</label>
                <select name="department" class="form-select" required>
                  <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Communication">Electronics & Communication</option>
                  <option value="Data Science & AI">Data Science & AI</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Semester</label>
                <select name="semester" class="form-select" required>
                  <option value="1">Sem 1</option>
                  <option value="2">Sem 2</option>
                  <option value="3">Sem 3</option>
                  <option value="4">Sem 4</option>
                  <option value="5" selected>Sem 5</option>
                  <option value="6">Sem 6</option>
                  <option value="7">Sem 7</option>
                  <option value="8">Sem 8</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label fw-semibold small">Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="+91 98765 12345" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Password</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="6" required />
              </div>
            </div>

            <div id="passwordMismatchFeedback" class="alert alert-danger py-2 small mt-3 d-none">
              Passwords do not match.
            </div>

            <button type="submit" class="btn btn-indigo w-100 py-2 mt-4 mb-3">Complete Registration</button>
          </form>

          <div class="text-center small">
            Already registered? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
